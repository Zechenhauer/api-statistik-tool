<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ API-Football Statistik & Analyse Dashboard</title>
    <style>
        :root {
            --bg-color: #0c0808;
            --card-bg: #110d0d;
            --accent-color: #ff6600;
            --accent-hover: #e65c00;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--accent-color); padding-bottom: 15px; }
        h1 { font-size: 1.6rem; color: var(--accent-color); }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        label { font-size: 0.85rem; color: var(--text-muted); width: 100%; margin-bottom: -5px; }
        select, button { background: #21262d; color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; }
        select { flex: 2; min-width: 250px; }
        button { background: var(--accent-color); color: #fff; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; flex: 1; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: #238636; }
        button.secondary:hover { background: #2ea043; }
        button.season-btn { background: #1f6feb; }
        button.season-btn:hover { background: #388bfd; }
        button.table-btn { background: #8957e5; }
        button.table-btn:hover { background: #6f42c1; }
        button.teamstats-btn { background: #e3b341; color: #000; }
        button.teamstats-btn:hover { background: #d29922; }
        button.cache-btn { background: #30363d; flex: unset; }

        .match-item { background: #161b22; border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; flex-wrap: wrap; gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
        th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
        td.center, th.center { text-align: center; }
        .player-row { display: flex; align-items: center; gap: 6px; }
        .player-row img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
        .team-section { margin-bottom: 20px; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 10px; }
        .stat-card { background: #1f242c; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; }
        .stat-card h4 { color: var(--accent-color); margin-bottom: 10px; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ API-Football Statistik-Dashboard</h1>
            <div style="color: var(--text-muted); font-size: 0.85rem; display:flex; justify-content:center; gap:15px; align-items:center; margin-top:5px; flex-wrap:wrap;">
                <span>Optimiert mit LocalStorage-Caching für maximale API-Schonung</span>
                <button class="cache-btn" onclick="clearAppCache()" title="Cache leeren">🔄 Cache leeren</button>
            </div>
        </header>

        <div class="card">
            <!-- 1. Ligen-Wechsler -->
            <div class="form-group">
                <label>Wähle eine Liga:</label>
                <select id="leagueSelect" onchange="onLeagueChange()">
                    <option value="78">1. Bundesliga (Deutschland)</option>
                    <option value="79">2. Bundesliga (Deutschland)</option>
                    <option value="80">3. Liga (Deutschland)</option>
                    <option value="2">UEFA Champions League</option>
                    <option value="3">UEFA Europa League (Nur deutsche Teams)</option>
                    <option value="848">UEFA Conference League (Nur deutsche Teams)</option>
                </select>
                <button class="table-btn" onclick="fetchLeagueStandings()">📊 Ligatabelle</button>
            </div>

            <!-- 2. Vereins-Dropdown & Aktionen -->
            <div class="form-group">
                <label>Wähle einen Verein:</label>
                <select id="teamSelect" onchange="onTeamChange()">
                    <option value="">Lade Vereine...</option>
                </select>
                <button onclick="fetchTeamFixtures()">Spiele</button>
                <button class="season-btn" onclick="fetchSeasonPlayerStats('rating')">⭐ Kader-Stats</button>
                <button class="teamstats-btn" onclick="fetchAdvancedTeamStats()">📈 Team-Stats</button>
            </div>
        </div>

        <div class="card" id="outputCard" style="display: none;">
            <h3 style="color: var(--accent-color); margin-bottom: 12px; font-size: 1.1rem;" id="outputTitle">Statistiken</h3>
            <div id="fixturesContainer">Lade...</div>
        </div>
    </div>

    <script>
        const apiKey = "297322363f3bf16e1304cfb933a0c8d5";
        const season = "2026";
        let cachedSeasonData = [];

        function setCachedData(key, data) {
            localStorage.setItem(key, JSON.stringify({ timestamp: new Date().getTime(), data: data }));
        }

        function getCachedData(key) {
            const cachedStr = localStorage.getItem(key);
            if (!cachedStr) return null;
            try {
                const cacheObj = JSON.parse(cachedStr);
                if (new Date().getTime() - cacheObj.timestamp < 6 * 60 * 60 * 1000) return cacheObj.data;
            } catch (e) {}
            localStorage.removeItem(key);
            return null;
        }

        function clearAppCache() {
            localStorage.clear();
            cachedSeasonData = [];
            alert("Lokaler Cache wurde geleert!");
            loadTeamsDropdown();
        }

        function onLeagueChange() {
            cachedSeasonData = [];
            loadTeamsDropdown();
        }

        function onTeamChange() {
            cachedSeasonData = [];
        }

        async function loadTeamsDropdown() {
            const leagueId = document.getElementById("leagueSelect").value;
            const teamSelect = document.getElementById("teamSelect");
            const cacheKey = `teams_league_${leagueId}_season_${season}`;
            
            teamSelect.innerHTML = `<option value="">Lade Vereine...</option>`;
            let teamsData = getCachedData(cacheKey);

            if (!teamsData) {
                try {
                    const res = await fetch(`https://v3.football.api-sports.io/teams?league=${leagueId}&season=${season}`, {
                        headers: { "x-apisports-key": apiKey }
                    });
                    const data = await res.json();
                    if (data.response) {
                        teamsData = data.response;
                        setCachedData(cacheKey, teamsData);
                    }
                } catch (e) {
                    teamSelect.innerHTML = `<option value="">Fehler beim Laden</option>`;
                    return;
                }
            }

            if (teamsData && teamsData.length > 0) {
                teamSelect.innerHTML = "";
                let teams = teamsData;
                if (leagueId === '3' || leagueId === '848') {
                    teams = teams.filter(item => item.team.country === 'Germany');
                }
                teams.sort((a, b) => a.team.name.localeCompare(b.team.name));

                teams.forEach(item => {
                    const t = item.team;
                    const opt = document.createElement("option");
                    opt.value = t.id;
                    opt.textContent = `${t.name} (${t.country})`;
                    teamSelect.appendChild(opt);
                });
                onTeamChange();
            }
        }

        async function fetchAdvancedTeamStats() {
            const leagueId = document.getElementById("leagueSelect").value;
            const teamSelect = document.getElementById("teamSelect");
            const teamId = teamSelect.value;
            const teamName = teamSelect.options[teamSelect.selectedIndex]?.text || '';
            
            const outputCard = document.getElementById("outputCard");
            const container = document.getElementById("fixturesContainer");
            const outputTitle = document.getElementById("outputTitle");
            const cacheKey = `teamstats_team_${teamId}_league_${leagueId}_season_${season}`;

            if (!teamId) {
                alert("Bitte wähle zuerst einen Verein aus.");
                return;
            }

            outputCard.style.display = "block";
            outputTitle.textContent = `Erweiterte Team-Statistiken: ${teamName}`;
            container.innerHTML = "Lade Team-Statistiken...";

            let statsData = getCachedData(cacheKey);

            if (!statsData) {
                try {
                    const res = await fetch(`https://v3.football.api-sports.io/teams/statistics?league=${leagueId}&season=${season}&team=${teamId}`, {
                        headers: { "x-apisports-key": apiKey }
                    });
                    const data = await res.json();
                    if (data.response) {
                        statsData = data.response;
                        setCachedData(cacheKey, statsData);
                    }
                } catch (e) {
                    container.innerHTML = "Fehler beim Laden der Team-Statistiken.";
                    return;
                }
            }

            if (!statsData) {
                container.innerHTML = "Keine Team-Statistiken verfügbar.";
                return;
            }

            let fixtures = statsData.fixtures || {};
            let goals = statsData.goals || {};
            let cleanSheet = statsData.clean_sheet || {};
            let failedToScore = statsData.failed_to_score || {};
            let cards = statsData.cards || {};

            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>📊 Form & Spiele</h4>
                        <div class="stat-row"><span>Aktuelle Form:</span> <b>${statsData.form || '-'}</b></div>
                        <div class="stat-row"><span>Spiele gesamt:</span> <b>${fixtures.played.total ?? 0}</b></div>
                        <div class="stat-row"><span>Siege:</span> <span style="color:#2ea043; font-weight:bold;">${fixtures.wins.total ?? 0}</span></div>
                        <div class="stat-row"><span>Unentschieden:</span> <b>${fixtures.draws.total ?? 0}</b></div>
                        <div class="stat-row"><span>Niederlagen:</span> <span style="color:#da3633; font-weight:bold;">${fixtures.loses.total ?? 0}</span></div>
                    </div>

                    <div class="stat-card">
                        <h4>🏠 Heim- / Auswärtsbilanz</h4>
                        <div class="stat-row"><span>Heim-Siege:</span> <b>${fixtures.wins.home ?? 0}</b></div>
                        <div class="stat-row"><span>Heim-Niederlagen:</span> <b>${fixtures.loses.home ?? 0}</b></div>
                        <div class="stat-row"><span>Auswärts-Siege:</span> <b>${fixtures.wins.away ?? 0}</b></div>
                        <div class="stat-row"><span>Auswärts-Niederlagen:</span> <b>${fixtures.loses.away ?? 0}</b></div>
                    </div>

                    <div class="stat-card">
                        <h4>⚽ Tore & Offensive</h4>
                        <div class="stat-row"><span>Erzielte Tore gesamt:</span> <b>${goals.for.total.total ?? 0}</b></div>
                        <div class="stat-row"><span>Tore pro Spiel (Schnitt):</span> <b>${goals.for.average.total ?? 0}</b></div>
                        <div class="stat-row"><span>Ohne eigenen Torerfolg:</span> <b>${failedToScore.total ?? 0}</b></div>
                    </div>

                    <div class="stat-card">
                        <h4>🛡️ Defensive & Zu-Null</h4>
                        <div class="stat-row"><span>Kassierte Tore gesamt:</span> <b>${goals.against.total.total ?? 0}</b></div>
                        <div class="stat-row"><span>Gegentore pro Spiel (Schnitt):</span> <b>${goals.against.average.total ?? 0}</b></div>
                        <div class="stat-row"><span>Zu-Null-Spiele (Clean Sheets):</span> <b style="color:var(--accent-color);">${cleanSheet.total ?? 0}</b></div>
                    </div>

                    <div class="stat-card">
                        <h4>🟨 Disziplin (Karten)</h4>
                        <div class="stat-row"><span>Gelbe Karten (Gesamt):</span> <b>${(cards.yellow['0-15']?.total || 0) + (cards.yellow['16-30']?.total || 0) + (cards.yellow['31-45']?.total || 0) + (cards.yellow['46-60']?.total || 0) + (cards.yellow['61-75']?.total || 0) + (cards.yellow['76-90']?.total || 0) + (cards.yellow['91-105']?.total || 0) + (cards.yellow['106-120']?.total || 0)}</b></div>
                        <div class="stat-row"><span>Rote Karten (Gesamt):</span> <b>${(cards.red['0-15']?.total || 0) + (cards.red['16-30']?.total || 0) + (cards.red['31-45']?.total || 0) + (cards.red['46-60']?.total || 0) + (cards.red['61-75']?.total || 0) + (cards.red['76-90']?.total || 0)}</b></div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        async function fetchLeagueStandings() {
            const leagueId = document.getElementById("leagueSelect").value;
            const leagueName = document.getElementById("leagueSelect").selectedOptions[0].text;
            const outputCard = document.getElementById("outputCard");
            const container = document.getElementById("fixturesContainer");
            const outputTitle = document.getElementById("outputTitle");
            const cacheKey = `standings_league_${leagueId}_season_${season}`;

            outputCard.style.display = "block";
            outputTitle.textContent = `Tabelle: ${leagueName}`;
            container.innerHTML = "Lade Ligatabelle...";

            let standingsData = getCachedData(cacheKey);

            if (!standingsData) {
                try {
                    const res = await fetch(`https://v3.football.api-sports.io/standings?league=${leagueId}&season=${season}`, {
                        headers: { "x-apisports-key": apiKey }
                    });
                    const data = await res.json();
                    if (data.response && data.response.length > 0) {
                        standingsData = data.response[0].league.standings;
                        setCachedData(cacheKey, standingsData);
                    }
                } catch (e) {
                    container.innerHTML = "Fehler beim Laden der Tabelle.";
                    return;
                }
            }

            if (!standingsData || standingsData.length === 0) {
                container.innerHTML = "Keine Tabellendaten gefunden.";
                return;
            }

            let html = "";
            standingsData.forEach((group, index) => {
                if (standingsData.length > 1) {
                    html += `<h4 style="color:var(--accent-color); margin: 15px 0 5px 0;">Gruppe / Staffel ${index + 1}</h4>`;
                }

                html += `
                    <div class="team-section">
                        <table>
                            <tr>
                                <th class="center" style="width:30px;">#</th>
                                <th>Mannschaft</th>
                                <th class="center">Sp</th>
                                <th class="center">Tore</th>
                                <th class="center">Diff</th>
                                <th class="center" style="font-weight:bold;">Pkt</th>
                            </tr>
                `;

                group.forEach(row => {
                    let team = row.team;
                    let all = row.all;
                    let isGerman = team.country === 'Germany';
                    let rowStyle = (leagueId === '3' || leagueId === '848') && !isGerman ? 'opacity: 0.4;' : '';

                    html += `
                        <tr style="${rowStyle}">
                            <td class="center"><b>${row.rank}</b></td>
                            <td>
                                <div class="player-row">
                                    <img src="${team.logo}" style="width:20px; height:20px; object-fit:contain;">
                                    <span><b>${team.name}</b></span>
                                </div>
                            </td>
                            <td class="center">${all.played}</td>
                            <td class="center">${all.goals.for}:${all.goals.against}</td>
                            <td class="center">${row.goalsDiff > 0 ? '+' + row.goalsDiff : row.goalsDiff}</td>
                            <td class="center" style="font-weight:bold; color:var(--accent-color);">${row.points}</td>
                        </tr>
                    `;
                });

                html += `</table></div>`;
            });

            container.innerHTML = html;
        }

        async function fetchTeamFixtures() {
            const leagueId = document.getElementById("leagueSelect").value;
            const teamSelect = document.getElementById("teamSelect");
            const teamId = teamSelect.value;
            const teamName = teamSelect.options[teamSelect.selectedIndex]?.text || '';
            
            const outputCard = document.getElementById("outputCard");
            const container = document.getElementById("fixturesContainer");
            const outputTitle = document.getElementById("outputTitle");
            const cacheKey = `fixtures_team_${teamId}_league_${leagueId}_season_${season}`;

            if (!teamId) {
                alert("Bitte wähle zuerst einen Verein aus.");
                return;
            }

            outputCard.style.display = "block";
            outputTitle.textContent = `Spiele von: ${teamName}`;
            container.innerHTML = "Lade Vereins-Spiele...";

            let fixturesData = getCachedData(cacheKey);

            if (!fixturesData) {
                try {
                    const res = await fetch(`https://v3.football.api-sports.io/fixtures?league=${leagueId}&season=${season}&team=${teamId}`, {
                        headers: { "x-apisports-key": apiKey }
                    });
                    const data = await res.json();
                    if (data.response) {
                        fixturesData = data.response;
                        setCachedData(cacheKey, fixturesData);
                    }
                } catch (e) {
                    container.innerHTML = "Fehler beim Abrufen.";
                    return;
                }
            }

            if (!fixturesData || fixturesData.length === 0) {
                container.innerHTML = "Keine Spiele gefunden.";
                return;
            }

            let html = "";
            fixturesData.forEach(m => {
                let date = new Date(m.fixture.date).toLocaleDateString("de-DE", { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                let score = `${m.goals.home ?? '-'} : ${m.goals.away ?? '-'}`;
                let statusBadge = `<span style="color:var(--text-muted); font-size:0.8rem;">${m.fixture.status.short}</span>`;

                html += `
                    <div class="match-item">
                        <span>📅 ${date} ${statusBadge}</span>
                        <span><b>${m.teams.home.name}</b> vs <b>${m.teams.away.name}</b></span>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <span style="background:#21262d; padding:4px 10px; border-radius:4px; font-weight:bold;">${score}</span>
                            <button class="secondary" onclick="fetchPlayerStatsForFixture(${m.fixture.id}, '${m.teams.home.name} vs ${m.teams.away.name}')">🔍 Spielerstatistiken</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `<div style="margin-bottom:15px; color:var(--text-muted); font-size:0.85rem;">Klicke bei einem Spiel auf "Spielerstatistiken":</div>` + html;
        }

        async function fetchSeasonPlayerStats(sortBy = 'rating') {
            const leagueId = document.getElementById("leagueSelect").value;
            const teamSelect = document.getElementById("teamSelect");
            const teamId = teamSelect.value;
            const teamName = teamSelect.options[teamSelect.selectedIndex].text;
            
            const outputCard = document.getElementById("outputCard");
            const container = document.getElementById("fixturesContainer");
            const outputTitle = document.getElementById("outputTitle");
            const cacheKey = `players_team_${teamId}_league_${leagueId}_season_${season}`;

            if (!teamId) {
                alert("Bitte wähle zuerst einen Verein aus.");
                return;
            }

            outputCard.style.display = "block";
            outputTitle.textContent = `Saison-Gesamtstatistik (${season}): ${teamName}`;

            if (cachedSeasonData.length === 0) {
                let savedPlayers = getCachedData(cacheKey);
                if (savedPlayers) {
                    cachedSeasonData = savedPlayers;
                } else {
                    container.innerHTML = "Lade Kader-Statistiken...";
                    try {
                        const res = await fetch(`https://v3.football.api-sports.io/players?league=${leagueId}&season=${season}&team=${teamId}&page=1`, {
                            headers: { "x-apisports-key": apiKey }
                        });
                        const data = await res.json();
                        if (!data.response || data.response.length === 0) {
                            container.innerHTML = "Keine Saison-Statistiken gefunden.";
                            return;
                        }
                        cachedSeasonData = data.response;
                        setCachedData(cacheKey, cachedSeasonData);
                    } catch (e) {
                        container.innerHTML = "Fehler beim Laden.";
                        return;
                    }
                }
            }

            cachedSeasonData.sort((a, b) => {
                let statA = a.statistics[0];
                let statB = b.statistics[0];
                if (sortBy === 'rating') return (statB.games.rating || 0) - (statA.games.rating || 0);
                if (sortBy === 'goals') return (statB.goals.total || 0) - (statA.goals.total || 0);
                if (sortBy === 'games') return (statB.games.appearences || 0) - (statA.games.appearences || 0);
            });

            let html = `
                <div class="sort-bar">
                    <span style="font-size:0.85rem; color:var(--text-muted);">Sortieren nach:</span>
                    <div style="display:flex; gap:8px;">
                        <button style="padding:5px 10px; font-size:0.8rem; background:${sortBy==='rating'?'var(--accent-color)':'#21262d'}" onclick="fetchSeasonPlayerStats('rating')">⭐ Ø Note</button>
                        <button style="padding:5px 10px; font-size:0.8rem; background:${sortBy==='goals'?'var(--accent-color)':'#21262d'}" onclick="fetchSeasonPlayerStats('goals')">⚽ Tore</button>
                        <button style="padding:5px 10px; font-size:0.8rem; background:${sortBy==='games'?'var(--accent-color)':'#21262d'}" onclick="fetchSeasonPlayerStats('games')">👕 Spiele</button>
                    </div>
                </div>
                <div class="team-section">
                    <table>
                        <tr>
                            <th>Spieler</th>
                            <th class="center">Spiele</th>
                            <th class="center">Min</th>
                            <th class="center">Ø Note</th>
                            <th class="center">Tore</th>
                            <th class="center">Assists</th>
                            <th class="center">Gelb</th>
                            <th class="center">Rot</th>
                        </tr>
            `;

            cachedSeasonData.forEach(item => {
                const p = item.player;
                const st = item.statistics[0];
                html += `
                    <tr>
                        <td>
                            <div class="player-row">
                                <img src="${p.photo}" onerror="this.src='https://media.api-sports.io/football/players/default.png'">
                                <span><b>${p.name}</b></span>
                            </div>
                        </td>
                        <td class="center">${st.games.appearences ?? 0}</td>
                        <td class="center">${st.games.minutes ?? 0}</td>
                        <td class="center" style="font-weight:bold; color:${sortBy==='rating'?'var(--accent-color)':''};">${st.games.rating ? parseFloat(st.games.rating).toFixed(2) : '-'}</td>
                        <td class="center" style="font-weight:bold; color:${sortBy==='goals'?'var(--accent-color)':''};">${st.goals.total ?? '-'}</td>
                        <td class="center">${st.goals.assists ?? '-'}</td>
                        <td class="center">${st.cards.yellow ? '🟨 ' + st.cards.yellow : '-'}</td>
                        <td class="center">${(st.cards.red || st.cards.yellowred) ? '🟥 ' + ((st.cards.red||0)+(st.cards.yellowred||0)) : '-'}</td>
                    </tr>
                `;
            });

            html += `</table></div>`;
            container.innerHTML = html;
        }

        async function fetchPlayerStatsForFixture(fixtureId, matchTitle) {
            const container = document.getElementById("fixturesContainer");
            const cacheKey = `fixture_players_${fixtureId}`;
            container.innerHTML = `Lade Spielerstatistiken für ${matchTitle}...`;

            let fixturePlayers = getCachedData(cacheKey);
            if (!fixturePlayers) {
                try {
                    const res = await fetch(`https://v3.football.api-sports.io/fixtures/players?fixture=${fixtureId}`, {
                        headers: { "x-apisports-key": apiKey }
                    });
                    const data = await res.json();
                    if (data.response) {
                        fixturePlayers = data.response;
                        setCachedData(cacheKey, fixturePlayers);
                    }
                } catch (e) {}
            }

            if (!fixturePlayers || fixturePlayers.length === 0) {
                container.innerHTML = `<span style="color:#da3633;">Keine Statistiken verfügbar.</span><br><br><button onclick="fetchTeamFixtures()">← Zurück</button>`;
                return;
            }

            let html = `<div style="margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;"><b style="color:var(--accent-color);">Spiel: ${matchTitle}</b><button onclick="fetchTeamFixtures()">← Zurück zur Spieleliste</button></div>`;

            fixturePlayers.forEach(teamData => {
                const team = teamData.team;
                const players = teamData.players;
                players.sort((a, b) => (b.statistics[0].games.rating || 0) - (a.statistics[0].games.rating || 0));

                html += `
                    <div class="team-section">
                        <div style="font-weight:bold; color:var(--accent-color); margin-bottom:8px; display:flex; align-items:center; gap:8px;">
                            <img src="${team.logo}" style="width:20px; height:20px; object-fit:contain;"> <span>${team.name}</span>
                        </div>
                        <table>
                            <tr>
                                <th>Spieler</th>
                                <th class="center">Min</th>
                                <th class="center">Note</th>
                                <th class="center">Tore</th>
                                <th class="center">Assists</th>
                                <th class="center">Schüsse</th>
                                <th class="center">Karten</th>
                            </tr>
                `;

                players.forEach(pObj => {
                    const p = pObj.player;
                    const stats = pObj.statistics[0];
                    let cards = "";
                    if (stats.cards.yellow) cards += "🟨";
                    if (stats.cards.red) cards += "🟥";

                    html += `
                        <tr>
                            <td>
                                <div class="player-row">
                                    <img src="${p.photo}" onerror="this.src='https://media.api-sports.io/football/players/default.png'">
                                    <span><b>#${stats.games.number || '?'}</b> ${p.name}</span>
                                </div>
                            </td>
                            <td class="center">${stats.games.minutes ?? 0}</td>
                            <td class="center"><b>${stats.games.rating ? parseFloat(stats.games.rating).toFixed(1) : '-'}</b></td>
                            <td class="center">${stats.goals.total ? '⚽ ' + stats.goals.total : '-'}</td>
                            <td class="center">${stats.goals.assists ?? '-'}</td>
                            <td class="center">${stats.shots.total ?? '-'}</td>
                            <td class="center">${cards || '-'}</td>
                        </tr>
                    `;
                });
                html += `</table></div>`;
            });

            container.innerHTML = html;
        }

        loadTeamsDropdown();
    </script>
</body>
</html>
